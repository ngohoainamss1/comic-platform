name: Automated Chapter Sync & AVIF Compression

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      comic_url:
        description: 'URL bộ truyện cần cào ngay (để trống nếu quét tất cả nguồn)'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt thư viện hệ thống libvips (hỗ trợ AVIF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libheif-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Chạy Crawler tự động cào, nén AVIF & xuất bản
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_STORAGE_CHANNEL_ID: ${{ secrets.TG_STORAGE_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_BACKUP_REPO: ${{ secrets.GH_BACKUP_REPO }}
        run: |
          python -m scripts.crawler.sync_manager --comic-url "${{ github.event.inputs.comic_url }}"
